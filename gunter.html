<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunter Workshop | Gunter's Forge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="gunter-gate-page">
    <header>
        <button type="button" onclick="navindex()" aria-label="Back to shop">
            <img src="assets/icons/backarrow.PNG" alt="">
        </button>
        <h2>Gunter's Forge</h2>
        <span class="workshop-label">WORKSHOP</span>
    </header>
    <main class="gunter-gate-main">
        <p class="admin-eyebrow">PRIVATE WORKSHOP</p>
        <h1>Gunter's panel</h1>
        <form id="gunter-login-form" class="gunter-login-form">
            <label for="gunter-password">Workshop password</label>
            <input id="gunter-password" type="password" autocomplete="current-password" required>
            <button class="admin-primary-button" type="submit">Unlock workshop</button>
            <p id="gunter-login-message" class="admin-message" role="status" aria-live="polite"></p>
        </form>
        <section id="gunter-dashboard" class="gunter-dashboard" hidden>
            <h2>Workshop tools</h2>
            <div class="admin-selector">
                <a href="orders.html" class="admin-selector-link">
                    <span>Orders</span>
                    <span>Update order progress and queue</span>
                </a>
                <a href="inventory.html" class="admin-selector-link">
                    <span>Inventory</span>
                    <span>Review and update material stock</span>
                </a>
            </div>
            <button type="button" class="admin-secondary-button" onclick="logoutGunter()">Lock workshop</button>
        </section>
    </main>
    <nav class="admin-nav" aria-label="Store navigation">
        <a href="ordertracking.html">Order Tracking</a>
        <a href="gunter.html">Gunter's access</a>
    </nav>
    <script src="script.js"></script>
</body>
</html>
