<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button onclick="window.history.back()">Back</button>
        <h2>Your Cart</h2>
    </header>

    <main>
        <section class="cart-items">
            <div class="item-list">
            </div>
        </section>
        <section id="cart-summary">
            <p>Total Price: <span id="total-price">0.00</span> gold</p>
            <button type="button" onclick="checkout()">Proceed to Checkout</button>
        </section>
    </main>

    <nav>
        <button onclick="navindex()">
            <img src="assets/icons/homeicon.PNG" alt="Home Logo" width="50">
        </button>
        <button>Shop</button>
        <button class="nav-icon-label" type="button" onclick="window.location.href='ordertracking.html'">
            <img src="assets/icons/ordertrackingicon.PNG" alt="Order Tracking Logo" width="50">
            <span>Order Tracking</span>
        </button>
        <button class="nav-icon-label" type="button" onclick="window.location.href='gunter.html'">
            <img src="assets/icons/guntersaccessicon.PNG" alt="Gunter's Access Logo" width="50">
            <span>Gunter's Access</span>
        </button>
    </nav>
    <script src="script.js"></script>
</body>
</html>
