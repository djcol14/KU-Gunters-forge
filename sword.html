<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sword Product Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-product="sword">
    
    <header>
        <button onclick="window.history.back()">
            <img src="assets/icons/backarrow.PNG" alt="Back Button">
        </button>
        <h2>Gunter's Forge</h2>
        <button onclick="opencart()">
            <img src="assets/icons/carticon.PNG" alt="Cart Logo" width="50">
        </button>
    </header>

    <section>
    <h1>Sword</h1>
    <img class="product-image-page" id="sword-image-page" src="assets/products/swordproduct.PNG" alt="Sword Image">
    <p>A sharp and sturdy sword for combat. Can be used for both melee and ranged attacks.</p>
    <p>Price = 75 Gold Pieces</p>
    

    <div class="quantity-selector">
        <button type="button" onclick="changeQuantity(-1)">-</button>
        <span id="quantity">1</span>
        <button type="button" onclick="changeQuantity(1)">+</button>
    </div>

    <p>Total Price: <span id="total-price">0.00</span> gold</p>

    <button type="button" onclick="addtocart('sword')">Add to Cart</button>

    </section>
    <nav>
        <button onclick="navindex()">
            <img src="assets/icons/homeicon.PNG" alt="Home Logo" width="50">
        </button>
        <button>Shop</button>
        <button type="button" onclick="window.location.href='ordertracking.html'">Order Tracking</button>
        <button type="button" onclick="window.location.href='gunter.html'">Gunter's access</button>
    </nav>
    <script src="script.js"></script>
</body>
</html>
