<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sword Product Page</title>
</head>
<body data-product="sword">
    
    <header>
        <button onclick="window.history.back()">Back</button>
        <h2>Gunter's Forge</h2>
        <button>Cart</button>
    </header>

    <h1>Sword</h1>
    <h4>This is a place holder for product image</h4>
    <p>A sharp and sturdy sword for combat. Can be used for both melee and ranged attacks.</p>
    <p>Price = 75 Gold Pieces</p>

    <div class="quantity-selector">
        <button type="button" onclick="changeQuantity(-1)">-</button>
        <span id="quantity">1</span>
        <button type="button" onclick="changeQuantity(1)">+</button>
    </div>

    <p>Total Price: <span id="total-price">0.00</span> gold</p>

    <button type="button" onclick="addtocart()">Add to Cart</button>
    <script src="script.js"></script>
</body>
</html>
