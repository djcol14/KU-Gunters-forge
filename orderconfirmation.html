<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order confirmation screen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button onclick="navindex()">
            <img src="assets/icons/backarrow.PNG" alt="Back Button">
        </button>
        <h2>Gunter's Forge</h2>
        <button onclick="opencart()">
            <img src="assets/icons/carticon.PNG" alt="Cart Logo">
        </button>
    </header>
    <main>
        <h1>Order Placed</h1>
        <p>Your order number is: <span id="order-number">0000</span></p>
        <p>Customer: <span id="order-customer-name"></span></p>
        <section class="order-details">
            <h2>Order Details</h2>
            <p>Items in your order:</p>
            <ul id="order-items">
                <!-- Items will be populated by JavaScript -->
            </ul>
        </section>
        <section class="order-total">
            <h2>Order Total</h2>
            <p>Total: <span id="order-total">0</span> gold</p>
        </section>
        <h2>Thank you for your purchase!</h2>
        <p><a href="ordertracking.html">Track this order</a></p>
        
    </main>

    <nav>
        <button onclick="navindex()">
            <img src="assets/icons/homeicon.PNG" alt="Home Logo" width="50">
        </button>
        <button>Shop</button>
        <button type="button" onclick="window.location.href='ordertracking.html'">Order Tracking</button>
        <button type="button" onclick="window.location.href='gunter.html'">Gunter's access</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
