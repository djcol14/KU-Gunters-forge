<!DOCTYPE html>
<!-- Defines the page as HTML5 and sets the language -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunter's Forge</title>
    <link rel="stylesheet" href="style.css">
    <!-- Connects the stylesheet -->
</head>
<body class="home-page">
      <!-- Header with home button, store name, and cart button -->
    <header>
        <button type="button" onclick="navindex()" aria-label="Home">
            <img src="assets/icons/homeicon.PNG" alt="">
        </button>
        <div class="header-brand">
            <img class="header-squiggle header-squiggle-left" src="assets/icons/squiggle.PNG" alt="">
            <h1>Gunter's Forge</h1>
            <img class="header-squiggle header-squiggle-right" src="assets/icons/squiggle.PNG" alt="">
        </div>
        <button onclick="opencart()">
            <img src="assets/icons/carticon.PNG" alt="Cart Logo">
        </button>
    </header>
       <!-- Welcome section with the forge background, Gunter, and introduction -->
    <main>
        <section class="hero">
            <img class="hero-background" src="assets/backgrounds/ForgeBackground.PNG" alt="Forge Background">
            <img class="hero-gunter" src="assets/logos/gunter.PNG" alt="Gunter the blacksmith">
            <div class="gunter-intro">
            <img class="intro-scroll" src="assets/backgrounds/textbox.PNG" alt="">
            <h1>Welcome to Gunter's Forge!</h1>
            <p>Quality goods for adventures, made by Gunter himself.</p>
            </div>
        </section>
           <!-- Product cards with images, prices, and links to product details -->
        <section class="products">
            <div class="product-card" id="sword-card" onclick="openProduct('sword')">
                <img src="assets/products/swordproduct.PNG" alt="Sword">
                <h2>Sword</h2>
                <p>50 gold pieces</p>
                <button>View Details</button>
            </div>
            <div class="product-card" id="chainmail-card" onclick="openProduct('chainmail')">
                <img src="assets/products/chainmailproduct.PNG" alt="Chain Mail">
                <h2>Chain Mail</h2>
                <p>100 gold pieces</p>
                <button>View Details</button>
            </div>
            <div class="product-card" id="platearmor-card" onclick="openProduct('platearmor')">
                <img src="assets/products/platearmorproduct.PNG" alt="Plate Armor">
                <h2>Plate Armor</h2>
                <p>200 gold pieces</p>
                <button>View Details</button>
            </div>
            <div class="product-card" id="cookingpot-card" onclick="openProduct('cookingpot')">
                <img src="assets/products/cookingpotproduct.PNG" alt="Cooking Pot">
                <h2>Cooking Pot</h2>
                <p>25 gold pieces</p>
                <button>View Details</button>
            </div>
        </section>
    </main>
      <!-- Bottom navigation for home, order tracking, and Gunter's access -->
    <nav class="store-nav" aria-label="Store navigation">
        <button class="nav-icon-label" type="button" onclick="navindex()" aria-label="Home"><img src="assets/icons/homeicon.PNG" alt=""><span>Home</span></button>
        <button class="nav-icon-label" type="button" onclick="window.location.href='ordertracking.html'">
            <img src="assets/icons/ordertrackingicon.PNG" alt="Order Tracking Logo" width="50">
            <span>Order Tracking</span>
        </button>
        <button class="nav-icon-label" type="button" onclick="window.location.href='gunter.html'">
            <img src="assets/icons/guntersaccessicon.PNG" alt="Gunter's Access Logo" width="50">
            <span>Gunter's Access</span>
        </button>
    </nav>
    <script src="script.js"></script>
    <!-- Connects the JavaScript file -->
</body>
</html>
