<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunter's Forge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Gunter's Forge</h1>
        <button id="cartButton">Cart</button>
    </header>

    <main>
        <h2>Welcome to Gunter's Forge</h2>
        <p>Masterfully forged tools for the people of Mautern.</p>

        <section class="products">

            <button class="product-card" onclick="openProduct('sword')">
                <div class="product-image">⚔️</div>
                <h3>Sword</h3>
                <p>View Sword</p>
            </button>

            <button class="product-card" onclick="openProduct('armor')">
                <div class="product-image">🛡️</div>
                <h3>Plate Armor</h3>
                <p>View Armor</p>
            </button>

            <button class="product-card" onclick="openProduct('chainmail')">
                <div class="product-image">⛓️</div>
                <h3>Chain Mail</h3>
                <p>View Chain Mail</p>
            </button>

            <button class="product-card" onclick="openProduct('pot')">
                <div class="product-image">🍲</div>
                <h3>Cooking Pot</h3>
                <p>View Cooking Pot</p>
            </button>

        </section>
    </main>

    <nav class="bottom-nav">
        <button>Home</button>
        <button>Shop</button>
        <button>Orders</button>
    </nav>

    <script src="script.js"></script>

</body>
</html>
