<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plate Armor Product Page</title>
</head>
<body data-product="platearmor">
    <header>
        <button onclick="window.history.back()">Back</button>
        <h2>Gunter's Forge</h2>
        <button>
            <img src="assets/icons/carticon.PNG" alt="Cart Logo" width="50">
        </button>
    </header>
    <h1>Plate Armor</h1>
    <h4>This is a place holder for product image</h4>
    <p>Plate armor is a type of body armor created with metal plates that cover the entire body. Plate armor is commonly paired with chain mail to provide maximum protection.</p>
    <p>Price = 200 Gold Pieces</p>
    <div class="quantity-selector">
        <button type="button" onclick="changeQuantity(-1)">-</button>
        <span id="quantity">1</span>
        <button type="button" onclick="changeQuantity(1)">+</button>
    </div>

    <p>Total Price: <span id="total-price">0.00</span> gold</p>

    <button type="button" onclick="addtocart()">Add to Cart</button>

    <nav>
        <button>
            <img src="assets/icons/homeicon.PNG" alt="Home Logo" width="50">
        </button>
        <button>Shop</button>
        <button>Inventory</button>
        <button>Orders</button>
    </nav>
    <script src="script.js"></script>
</body>
</html>
