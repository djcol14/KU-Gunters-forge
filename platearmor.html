<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plate Armor Product Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-product="platearmor">
    <header>
        <button onclick="window.history.back()">
            <img src="assets/icons/backarrow.PNG" alt="Back Button">
        </button>
        <h2>Gunter's Forge</h2>
        <button onclick="opencart()">
            <img src="assets/icons/carticon.PNG" alt="Cart Logo">
        </button>
    </header>
    <h1>Plate Armor</h1>
    <img class="product-image-page" id="platearmor-image-page" src="assets/products/platearmorproduct.PNG" alt="Plate Armor">
    <p>Plate armor is a type of body armor created with metal plates that cover the entire body. Plate armor is commonly paired with chain mail to provide maximum protection.</p>
    <p>Price = 200 Gold Pieces</p>
    <div class="quantity-selector">
        <button type="button" onclick="changeQuantity(-1)">-</button>
        <span id="quantity">1</span>
        <button type="button" onclick="changeQuantity(1)">+</button>
    </div>

    <p>Total Price: <span id="total-price">0.00</span> gold</p>

    <button type="button" onclick="addtocart('platearmor')">Add to Cart</button>

    <nav>
        <button onclick="navindex()">
            <img src="assets/icons/homeicon.PNG" alt="Home Logo" width="50">
        </button>
        <button>Shop</button>
        <button class="nav-icon-label" type="button" onclick="window.location.href='ordertracking.html'">
            <img src="assets/icons/ordertrackingicon.PNG" alt="Order Tracking Logo" width="50">
            <span>Order Tracking</span>
        </button>
        <button class="nav-icon-label" type="button" onclick="window.location.href='gunter.html'">
            <img src="assets/icons/guntersaccessicon.PNG" alt="Gunter's Access Logo" width="50">
            <span>Gunter's Access</span>
        </button>
    </nav>
    <script src="script.js"></script>
</body>
</html>
