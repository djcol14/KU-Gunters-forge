<!DOCTYPE html>
<!-- Defines the page as HTML5 and sets the language -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plate Armor Product Page</title>
    <link rel="stylesheet" href="style.css">
    <!-- Connects the stylesheet -->
</head>
<body data-product="platearmor">
    <header>
          <!-- Header with home button, store name, and cart button -->
        <button onclick="window.history.back()">
            <img src="assets/icons/backarrow.PNG" alt="Back Button">
        </button>
        <div class="header-brand">
            <img class="header-squiggle header-squiggle-left" src="assets/icons/squiggle.PNG" alt="">
            <h2>Gunter's Forge</h2>
            <img class="header-squiggle header-squiggle-right" src="assets/icons/squiggle.PNG" alt="">
        </div>
        <button onclick="opencart()">
            <img src="assets/icons/carticon.PNG" alt="Cart Logo">
        </button>
    </header>
       <!-- Plate armor product details and purchasing options -->
    <section>
    <h1>Plate Armor</h1>
    <img class="product-image-page" id="platearmor-image-page" src="assets/products/platearmorproduct.PNG" alt="Plate Armor">
    <p>Plate armor is a type of armor created with a series of metal plates that cover the whole body. Plate armor is commonly paired with chain mail to provide maximum protection.</p>
    <p>Price = 200 Gold Pieces</p>
           <!-- Select quantity and view the total price -->
    <div class="quantity-selector">
        <button type="button" onclick="changeQuantity(-1)">-</button>
        <span id="quantity">1</span>
        <button type="button" onclick="changeQuantity(1)">+</button>
    </div>

    <p>Total Price: <span id="total-price">0.00</span> gold</p>

    <button type="button" onclick="addtocart('platearmor')">Add to Cart</button>
    </section>

    <!-- Bottom navigation between store pages -->
    <nav class="store-nav" aria-label="Store navigation">
        <button class="nav-icon-label" type="button" onclick="navindex()" aria-label="Home"><img src="assets/icons/homeicon.PNG" alt=""><span>Home</span></button>
        <button class="nav-icon-label" type="button" onclick="window.location.href='ordertracking.html'"><img src="assets/icons/ordertrackingicon.PNG" alt=""><span>Order Tracking</span></button>
        <button class="nav-icon-label" type="button" onclick="window.location.href='gunter.html'"><img src="assets/icons/guntersaccessicon.PNG" alt=""><span>Gunter's Access</span></button>
            <button class="nav-icon-label" type="button" onclick="window.location.href='mine.html'" aria-label="Mine"><img class="nav-pickaxe-icon" src="assets/icons/PickaxIcon.PNG" alt=""><span>Mine</span></button>
</nav>
    <script src="script.js"></script>
    <!-- Connects the JavaScript file -->
    </body>
</html>
