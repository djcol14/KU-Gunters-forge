<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#151b22">
    <title>Gunter's Gathering | Gunter's Forge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button type="button" onclick="window.location.href='index.html'" aria-label="Back to home">
            <img src="assets/icons/backarrow.PNG" alt="">
        </button>
        <div class="header-brand">
            <img class="header-squiggle header-squiggle-left" src="assets/icons/squiggle.PNG" alt="">
            <h2>Gunter's Forge</h2>
            <img class="header-squiggle header-squiggle-right" src="assets/icons/squiggle.PNG" alt="">
        </div>
        <button type="button" onclick="window.location.href='cart.html'" aria-label="Open cart">
            <img src="assets/icons/carticon.PNG" alt="">
        </button>
    </header>

    <main class="gathering-main">
        <section class="gathering-intro" aria-labelledby="game-heading">
            <img src="assets/logos/gunter.PNG" alt="Gunter the blacksmith">
            <div>
                <h1 id="game-heading">Gather for the Forge</h1>
                <p>Swap neighboring tiles to line up three or more matching resources.</p>
            </div>
        </section>

        <h2 id="location-heading" class="gathering-location-title">The Mine</h2>
        <div id="gathering-board" class="gathering-board" aria-label="Match three resource tiles"></div>

        <p id="gathering-message" class="gathering-message" role="status" aria-live="polite">
            Choose two neighboring tiles. Match three or more to gather materials.
        </p>

        <section aria-labelledby="inventory-heading">
            <h2 id="inventory-heading" class="gathering-location-title">Forge storehouse</h2>
            <dl id="gathering-inventory" class="gathering-inventory"></dl>
        </section>
    </main>

    <nav class="gathering-locations" aria-label="Gathering locations">
        <button class="gathering-location" type="button" data-location="mine" aria-pressed="true">Mine</button>
        <button class="gathering-location" type="button" data-location="forest" aria-pressed="false">Forest</button>
        <button class="gathering-location" type="button" data-location="town" aria-pressed="false">Town</button>
    </nav>

    <nav class="store-nav" aria-label="Store navigation">
        <button class="nav-icon-label" type="button" onclick="navindex()" aria-label="Home"><img src="assets/icons/homeicon.PNG" alt=""><span>Home</span></button>
        <button class="nav-icon-label" type="button" onclick="window.location.href='ordertracking.html'"><img src="assets/icons/ordertrackingicon.PNG" alt=""><span>Order Tracking</span></button>
        <button class="nav-icon-label" type="button" onclick="window.location.href='gunter.html'"><img src="assets/icons/guntersaccessicon.PNG" alt=""><span>Gunter's Access</span></button>
        <button class="nav-icon-label" type="button" onclick="window.location.href='mine.html'" aria-label="Mine" aria-current="page"><img class="nav-pickaxe-icon" src="assets/icons/PickaxIcon.PNG" alt=""><span>Mine</span></button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
