<!DOCTYPE html>
<!-- Defines the page as HTML5 and sets the language -->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Track an Order | Gunter's Forge</title>
	<link rel="stylesheet" href="style.css">
	<!-- Connects the stylesheet -->
</head>
<body class="customer-tracking-page">
	  <!-- Header with home button, store name, and cart button -->
	<header>
		<button type="button" onclick="navindex()" aria-label="Back to home">
			<img src="assets/icons/backarrow.PNG" alt="">
		</button>
		<div class="header-brand">
			<img class="header-squiggle header-squiggle-left" src="assets/icons/squiggle.PNG" alt="">
			<h2>Gunter's Forge</h2>
			<img class="header-squiggle header-squiggle-right" src="assets/icons/squiggle.PNG" alt="">
		</div>
		<button type="button" onclick="opencart()" aria-label="Open cart">
			<img src="assets/icons/carticon.PNG" alt="">
		</button>
	</header>
	  <!-- Main order tracking area with search form and results -->
	<main class="customer-tracking-main">
		<h1>Track your order</h1>
		<p>Enter the customer name from your confirmation. Add an order number to narrow the search.</p>
		<form id="tracking-form" class="customer-tracking-form">
			<label for="tracking-customer-name">Customer name</label>
			<input id="tracking-customer-name" name="customerName" type="text" autocomplete="name" required>
			<label for="tracking-order-number">Order number</label>
			<input id="tracking-order-number" name="orderNumber" type="text" inputmode="numeric" placeholder="For example, 1001">
			<button type="submit">Find order</button>
			<p id="tracking-message" role="status" aria-live="polite"></p>
		</form>
		   <!-- Displays the matching order information -->
		<section id="tracking-result" class="customer-tracking-result" aria-live="polite" hidden></section>
	</main>
	  <!-- Bottom navigation for home, order tracking, and Gunter's access -->
	<nav class="store-nav" aria-label="Store navigation">
			<button class="nav-icon-label" type="button" onclick="navindex()" aria-label="Home"><img src="assets/icons/homeicon.PNG" alt=""><span>Home</span></button>
			<button class="nav-icon-label" type="button" onclick="window.location.href='ordertracking.html'"><img src="assets/icons/ordertrackingicon.PNG" alt=""><span>Order Tracking</span></button>
			<button class="nav-icon-label" type="button" onclick="window.location.href='gunter.html'"><img src="assets/icons/guntersaccessicon.PNG" alt=""><span>Gunter's Access</span></button>
	        <button class="nav-icon-label" type="button" onclick="window.location.href='mine.html'" aria-label="Mine"><img class="nav-pickaxe-icon" src="assets/icons/PickaxIcon.PNG" alt=""><span>Mine</span></button>
</nav>
	<script src="script.js"></script>
	<!-- Connects the JavaScript file -->
</body>
</html>
